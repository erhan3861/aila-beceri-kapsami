<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beceri Haritası · AI-LA</title>
<meta name="description" content="AI-LA beceri haritası: Maarif Modeli'nin altı alanı ve sınıfa göre veri gönderen platformlar.">
<link rel="icon" href="img/aila_mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@500;600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --indigo:#3A38B0; --murekkep:#23215C; --vurgu:#4F5BF9;
  --zemin:#F7F5FF; --yumusak:#EFECFF; --kenar:#E3DEFD; --soluk:#5B5A86;
  --maarif:#3A38B0; --maarif-a:#ECEBFF;
  --aila:#0E8A9A;   --aila-a:#E2F5F6;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden}
body{height:100vh; height:100dvh; background:var(--zemin); color:var(--murekkep); font:500 15px/1.45 Inter,system-ui,sans-serif; display:flex; flex-direction:column}

header{flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px 18px; flex-wrap:wrap; padding:14px clamp(14px,3vw,32px)}
.marka{display:flex; align-items:center; gap:12px}
.marka img{height:28px; width:auto; display:block}
.marka h1{margin:0; font:800 clamp(18px,2.4vw,24px)/1 Poppins,sans-serif; color:var(--indigo)}
.siniflar{display:flex; gap:3px; padding:4px; background:#fff; border:1px solid var(--kenar); border-radius:14px}
.siniflar button{min-width:38px; height:36px; border:0; border-radius:10px; background:transparent; font:700 15px Poppins; color:var(--soluk); cursor:pointer}
.siniflar button:hover{background:var(--yumusak); color:var(--indigo)}
.siniflar button[aria-pressed="true"]{background:linear-gradient(100deg,#3A38B0,#4F5BF9); color:#fff}
.siniflar small{align-self:center; padding:0 6px 0 8px; font:700 13px Poppins; color:var(--murekkep)}
.lejant{display:flex; gap:14px; font:600 13px Inter; color:var(--soluk)}
.lejant span{display:inline-flex; align-items:center; gap:6px}
.lejant i{width:12px; height:12px; border-radius:4px}

main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,0.85fr); gap:clamp(10px,2vw,28px); padding:0 clamp(14px,3vw,32px) clamp(14px,2.4vh,24px)}
.radar-kutu{min-height:0; display:flex; align-items:center; justify-content:center}
svg{width:100%; height:100%; max-height:100%; overflow:visible}
.ag{fill:none; stroke:var(--kenar); stroke-width:1.5}
.eksen{stroke:var(--kenar); stroke-width:1.5}
.kapsam{fill:rgba(79,91,249,.13); stroke:var(--vurgu); stroke-width:2.5; stroke-linejoin:round; transition:all .45s ease}
.dugum{cursor:pointer; outline:none}
.dugum circle.halka{fill:#fff; stroke-width:3; transition:r .2s, fill .2s}
.dugum text{font:700 15px Poppins; fill:var(--murekkep)}
.dugum text.sayi{font:800 15px Poppins}
.dugum:hover circle.halka,.dugum:focus-visible circle.halka{r:30}
.dugum.secili circle.halka{r:31}
.dugum.secili text.sayi{fill:#fff}
.nokta{transition:all .45s ease}

.panel{min-height:0; display:flex; flex-direction:column; background:#fff; border:1px solid var(--kenar); border-radius:22px; padding:clamp(14px,2.2vh,22px) clamp(14px,1.8vw,22px); overflow:hidden}
.panel-ust{flex:none; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.panel h2{margin:0; font:800 clamp(19px,2.6vh,24px)/1.15 Poppins; color:var(--murekkep)}
.tur{flex:none; font:700 12px Inter; padding:4px 10px; border-radius:999px; color:#fff}
.liste{flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px}
.satir{padding:10px 12px; border-radius:14px; background:var(--zemin); animation:gel .28s ease both}
.satir.bos{background:transparent; border:1px dashed var(--kenar)}
.satir-ust{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.satir b{font:700 15px Poppins}
.satir.bos b{color:var(--soluk)}
.kod{font:700 11.5px Inter; border-radius:6px; padding:1px 7px}
.alt{font:600 12px Inter; color:var(--soluk)}
.urunler{display:flex; flex-wrap:wrap; gap:5px}
.urun{display:inline-flex; align-items:center; gap:5px; font:600 12px Inter; padding:2px 9px 2px 7px; border-radius:999px; background:#fff; border:1px solid var(--kenar)}
.urun i{width:8px; height:8px; border-radius:50%}
.yok{font:600 12px Inter; color:var(--soluk)}
@keyframes gel{from{opacity:0; transform:translateY(5px)}to{opacity:1; transform:none}}

@media (max-width:820px), (max-aspect-ratio:1/1){
  main{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) minmax(0,1.1fr)}
  .lejant{order:3; width:100%}
}
@media (max-width:560px){
  header{padding:10px 12px; gap:8px}
  .marka img{height:22px}
  .siniflar{width:100%; justify-content:space-between}
  .siniflar button{min-width:0; flex:1; height:34px; font-size:14px}
  .siniflar small{padding:0 4px}
  .lejant{gap:4px 12px; font-size:11.5px; flex-wrap:wrap}
  .lejant span{white-space:nowrap}
  main{padding:0 12px 12px; gap:10px; grid-template-rows:minmax(0,1fr) minmax(0,1.05fr)}
  .dugum text{font-size:30px}
  .dugum text.sayi{font-size:26px}
  .dugum circle.halka{r:34}
  .dugum.secili circle.halka,.dugum:hover circle.halka{r:38}
  .panel{border-radius:18px; padding:12px}
  .panel h2{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="marka"><img src="img/aila_logo.png" alt="AI-LA"><h1>Beceri Haritası</h1></div>
  <div class="siniflar" id="siniflar" role="group" aria-label="Sınıf seç"><small>Sınıf</small></div>
  <div class="lejant">
    <span><i style="background:var(--maarif)"></i>Maarif grubu</span>
    <span><i style="background:var(--aila)"></i>AI-LA gruplaması</span>
    <span>Sayı = veri gönderen platform</span>
  </div>
</header>
<main>
  <div class="radar-kutu"><svg id="radar" viewBox="-105 -20 810 640" role="img" aria-label="Altı beceri alanı"></svg></div>
  <section class="panel" aria-live="polite">
    <div class="panel-ust"><h2 id="panelBaslik"></h2><span class="tur" id="panelTur"></span></div>
    <div class="liste" id="liste"></div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
